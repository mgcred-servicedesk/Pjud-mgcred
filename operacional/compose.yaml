name: mgcred-juridico
services:
  app:
    build: .
    image: mgcred-juridico:1.0.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${DOMAIN:?Configure DOMAIN no arquivo .env}
      HOST: 0.0.0.0
      PORT: 4320
      DATA_DIR: /data
      BACKUP_DIR: /backups
      TRUST_PROXY: "1"
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-2147483648}
    volumes:
      - portal_data:/data
      - portal_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backup:
    image: mgcred-juridico:1.0.0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "scripts/backup-service.mjs"]
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "86400"
      KEEP_BACKUPS: "14"
    volumes:
      - portal_data:/data:ro
      - portal_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{const x=JSON.parse(fs.readFileSync('/backups/last-success.json'));process.exit(Date.now()-Date.parse(x.time)<90000000?0:1)}catch{process.exit(1)}"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN no arquivo .env}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  portal_data:
  portal_backups:
  caddy_data:
  caddy_config:
