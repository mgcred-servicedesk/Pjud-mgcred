# Blueprint gratuito do Render — MVP do Portal Jurídico MG Cred.
# Destinado somente a apresentações: o banco gratuito expira em 30 dias e não possui backup.

services:
  - type: web
    name: mgcred-juridico
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia
    plan: free
    numInstances: 1
    healthCheckPath: /healthz
    # As migrações rodam antes do servidor pelo CMD do Dockerfile. Não usar
    # dockerCommand com aspas: o Render as repassa literalmente ao /bin/sh.
    # O plano gratuito não oferece pre-deploy command nem Shell. Este hook cria o primeiro
    # administrador e registra o link de ativação no log do primeiro deploy.
    # O e-mail vem de BOOTSTRAP_ADMIN_EMAIL (sem aspas/variáveis no comando).
    initialDeployHook: node src/scripts/create-admin.ts
    autoDeployTrigger: commit
    # domains:
    #   - juridico.DOMINIO.com.br
    # renderSubdomainPolicy: disabled   # ativar depois que o domínio próprio estiver no ar
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://mgcred-juridico.onrender.com # trocar pelo domínio definitivo
      - key: CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: MAX_STORAGE_BYTES
        # Reserva metade do banco de 1 GB para tabelas, índices e auditoria.
        value: "536870912"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mgcred-juridico-db
          property: connectionString

databases:
  - name: mgcred-juridico-db
    region: virginia
    plan: free
    postgresMajorVersion: "18"
    databaseName: mgcred
    user: mgcred
    ipAllowList: [] # somente a rede privada do Render
